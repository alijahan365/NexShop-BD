<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Google Fonts: Inter & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6.4.0 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bootstrap 4.6.2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <title>NexShop | Modern E-Commerce Platform</title>

  <style>
    :root {
      --brand-primary: #10b981;
      --brand-primary-dark: #059669;
      --brand-dark: #0f172a;
      --brand-navy: #1e293b;
      --brand-accent: #6366f1;
      --brand-bg: #f8fafc;
      --font-main: 'Inter', sans-serif;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--brand-bg);
      color: #334155;
      min-height: 100vh;
    }

    /* Top Announcement Bar */
    .top-announcement {
      background-color: #0b1329;
      color: #94a3b8;
      font-size: 0.82rem;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .top-announcement a {
      color: #cbd5e1;
      text-decoration: none;
      transition: color 0.2s;
    }

    .top-announcement a:hover {
      color: #34d399;
    }

    .support-pill {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 3px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Main Navigation Header */
    .navbar-nexshop {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      padding: 0.9rem 1.5rem;
    }

    .brand-logo-nexshop {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      color: #ffffff !important;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      text-decoration: none !important;
    }

    .brand-logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      margin-right: 10px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .brand-tag {
      font-size: 0.7rem;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      margin-left: 6px;
    }
  </style>
</head>

<body>

  <!-- Top Announcement Bar -->
  <div class="top-announcement d-none d-md-block">
    <div class="container-fluid px-lg-5 d-flex justify-content-between align-items-center">
      <div>
        <span class="mr-3"><i class="fa-solid fa-truck-fast text-success mr-1"></i> Express Nationwide Delivery</span>
        <span><i class="fa-solid fa-shield-check text-info mr-1"></i> 100% Authentic Products</span>
      </div>
      <div class="d-flex align-items-center">
        <span class="support-pill mr-3" onclick="toggleChatAssistant()">
          <i class="fa-brands fa-whatsapp mr-1"></i> WhatsApp Helpline: 01784299242
        </span>
        <a href="/orders"><i class="fa-solid fa-box-open mr-1"></i> Track Order</a>
      </div>
    </div>
  </div>

  <!-- Main Navigation Header -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-nexshop sticky-top">
    <div class="container-fluid px-lg-5">
      
      <a class="brand-logo-nexshop" href="/">
        <div class="brand-logo-icon"><i class="fa-solid fa-layer-group"></i></div>
        NexShop <span class="brand-tag" style="background: rgba(16, 185, 129, 0.2); color: #34d399;">BD</span>
      </a>

    </div>
  </nav>

</body>

</html>
