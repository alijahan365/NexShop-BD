{% extends 'base.html' %}

{% block content %}
{% load cart %}
{% load custom_filter %}

<style>
  .main-layout-wrapper {
    margin-top: 15px;
    margin-bottom: 30px;
  }

  .category-panel {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    border: 1px solid #e2e8f0;
    overflow-y: auto;
    max-height: calc(100vh - 110px);
    position: sticky;
    top: 95px;
    z-index: 10;
  }

  .category-panel::-webkit-scrollbar {
    width: 4px;
  }

  .category-panel::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 10px;
  }

  .category-panel-header {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #ffffff;
    padding: 16px 20px;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .category-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    color: #334155;
    font-weight: 500;
    font-size: 0.92rem;
    border-bottom: 1px solid #f1f5f9;
    text-decoration: none;
    transition: all 0.25s ease;
  }

  .category-item:hover, .category-item.active {
    background-color: #ecfdf5;
    color: #059669;
    font-weight: 600;
    padding-left: 24px;
    text-decoration: none;
  }

  .hero-banner-card {
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    margin-bottom: 25px;
  }

  /* Category Filter Pills */
  .category-pill-btn {
    border-radius: 30px;
    padding: 8px 18px;
    font-weight: 600;
    font-size: 0.85rem;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    color: #475569;
    margin-right: 6px;
    margin-bottom: 10px;
    transition: all 0.2s ease;
    text-decoration: none !important;
    display: inline-block;
  }

  .category-pill-btn:hover, .category-pill-btn.active {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #ffffff;
    border-color: #10b981;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
  }

  /* Product Card Styling */
  .nex-product-card {
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.3s ease;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    cursor: pointer;
  }

  .nex-product-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 16px 35px rgba(0, 0, 0, 0.08);
    border-color: #10b981;
  }

  .product-image {
    height: 200px;
    object-fit: cover;
    width: 100%;
    background: #f8fafc;
    transition: transform 0.5s ease;
  }

  .nex-product-card:hover .product-image {
    transform: scale(1.05);
  }

  .img-box {
    overflow: hidden;
    position: relative;
  }

  .product-name {
    font-size: 0.92rem;
    font-weight: 700;
    color: #0f172a;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.5rem;
    margin-bottom: 6px;
  }

  .star-rating {
    color: #f59e0b;
    font-size: 0.8rem;
  }

  .size-btn {
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 4px 12px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    margin-right: 6px;
    background: #ffffff;
    transition: all 0.2s;
  }

  .size-btn.active, .size-btn:hover {
    background: #10b981;
    color: white;
    border-color: #10b981;
  }

  .trust-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #e2e8f0;
  }

  .help-box-banner {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    border-radius: 16px;
    padding: 24px;
    color: white;
  }

  /* Mobile Horizontal Category Bar */
  .mobile-category-bar {
    display: flex;
    overflow-x: auto;
    white-space: nowrap;
    padding: 6px 2px 14px 2px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 8px;
  }
  .mobile-category-bar::-webkit-scrollbar {
    display: none;
  }
  .mobile-cat-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    padding: 8px 16px;
    border-radius: 25px;
    color: #334155;
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none !important;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    transition: all 0.2s ease;
  }
  .mobile-cat-pill:hover, .mobile-cat-pill.active {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #ffffff;
    border-color: #10b981;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }

  @media (max-width: 767px) {
    .product-image {
      height: 140px !important;
    }
    .product-name {
      font-size: 0.82rem !important;
      min-height: 2.2rem !important;
    }
    .nex-product-card {
      padding: 10px !important;
      border-radius: 12px !important;
    }
    .hero-banner-card {
      margin-bottom: 15px !important;
    }
    .hero-banner-card .display-4 {
      font-size: 1.5rem !important;
    }
    .hero-banner-card .lead {
      font-size: 0.88rem !important;
    }
  }
</style>

<div class="container-fluid px-lg-5">
  <div class="py-5 text-center">
    <h2 class="font-weight-bold text-dark">Welcome to NexShop E-Commerce Platform</h2>
    <p class="text-muted">Loading homepage product showcase...</p>
  </div>
</div>

{% endblock %}
