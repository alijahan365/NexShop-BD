{% extends 'base.html' %}

{% block content %}

<div class="p-3 m-3">

    <div class="col-lg-5 rounded mx-auto border pt-4">

        <h3 class="alert alert-success rounded-pill" style="text-align:center">
            Create an Account
        </h3>

        <form action="/signup" method="POST">

            {% csrf_token %}

            {% if error %}
            <div class="alert alert-danger" role="alert">
                {{error}}
            </div>
            {% endif %}

            <!-- First Name -->
            <div class="form-group">
                <label for="">First Name</label>
                <input type="text"
                       name="firstname"
                       value="{{values.first_name}}"
                       class="form-control form-control-sm">
            </div>

            <!-- Last Name -->
            <div class="form-group">
                <label for="">Last Name</label>
                <input type="text"
                       name="lastname"
                       value="{{values.last_name}}"
                       class="form-control form-control-sm">
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="">Phone</label>
                <input type="text"
                       name="phone"
                       value="{{values.phone}}"
                       class="form-control form-control-sm">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="">Email</label>
                <input type="email"
                       name="email"
                       value="{{values.email}}"
                       class="form-control form-control-sm">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="">Password</label>
                <input type="password"
                       name="password"
                       class="form-control form-control-sm">
            </div>

            <button type="submit"
                    class="btn btn-sm btn-success col-lg-12">
                Create an account
            </button>

        </form>
    </div>
</div>

{% endblock %}
