{% extends 'base.html' %}

{% block content %}

<div class="p-3 m-3">

    <div class="col-lg-5 rounded mx-auto border pt-4">

        <!-- Login Image -->
        <div class="text-center col">

            <img
                src="https://skillindiacsc.in/wp-content/uploads/2022/12/Skill-India-Online-Shopping.png"
                alt="Online Shopping"
                style="height: 150px;">

            <hr>

        </div>

        <!-- Login Title -->
        <h3 class="alert alert-light rounded-pill"
            style="text-align:center">
            Login
        </h3>

        <form action="/login" method="POST">

            {% csrf_token %}

            <!-- Error Message -->
            {% if error %}
            <div class="alert alert-danger" role="alert">
                {{error}}
            </div>
            {% endif %}

            <!-- Email -->
            <div class="form-group">
                <label for="">Email</label>

                <input required
                       type="email"
                       name="email"
                       value="{{values.email}}"
                       class="form-control form-control-sm"
                       placeholder="abc@gmail.com">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="">Password</label>

                <input required
                       type="password"
                       name="password"
                       class="form-control form-control-sm"
                       placeholder="Enter your password">
            </div>

            <!-- Remember Me -->
            <div class="mb-3 form-check">

                <input type="checkbox"
                       class="form-check-input"
                       id="exampleCheck1">

                <label class="form-check-label"
                       for="exampleCheck1">
                    Remember me
                </label>

            </div>

            <hr>

            <button type="submit"
                    class="btn btn-sm btn-success col-lg-12">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
